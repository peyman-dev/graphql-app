<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peyman's Gourmet Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #2B4B36;
        --primary-light: #3A6349;
        --secondary: #C8A97E;
        --text-dark: #1A1A1A;
        --text-light: #666666;
        --background: #F9F7F3;
        --white: #FFFFFF;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        --transition: all 0.3s ease;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--background);
        color: var(--text-dark);
        line-height: 1.6;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header {
        background-color: var(--white);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        padding: 20px 0;
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95);
      }

      .header-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-content h1 {
        font-family: 'Playfair Display', serif;
        font-size: 28px;
        font-weight: 700;
        color: var(--primary);
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        background-color: var(--primary);
        color: var(--white);
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: var(--transition);
        box-shadow: 0 2px 8px rgba(43, 75, 54, 0.2);
      }

      .back-button:hover {
        background-color: var(--primary-light);
        transform: translateY(-2px);
      }

      main {
        padding: 60px 0;
      }

      .title-section {
        text-align: center;
        margin-bottom: 60px;
      }

      .title-section h2 {
        font-family: 'Playfair Display', serif;
        font-size: 42px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 16px;
      }

      .title-section p {
        font-size: 18px;
        color: var(--text-light);
        max-width: 600px;
        margin: 0 auto;
      }

      .food-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 32px;
        min-height: 52vh;
      }

      .food-card {
        background-color: var(--white);
        border-radius: 20px;
        padding: 32px;
        box-shadow: var(--shadow);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }

      .food-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(to right, var(--primary), var(--secondary));
        transform: scaleX(0);
        transition: var(--transition);
        transform-origin: left;
      }

      .food-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      }

      .food-card:hover::before {
        transform: scaleX(1);
      }

      .food-card h2 {
        font-family: 'Playfair Display', serif;
        font-size: 24px;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 16px;
      }

      .food-card .price {
        font-size: 20px;
        font-weight: 700;
        color: var(--primary);
        background-color: rgba(43, 75, 54, 0.1);
        padding: 8px 20px;
        border-radius: 30px;
        display: inline-block;
        margin: 16px 0;
      }

      .food-card .inventory {
        font-size: 15px;
        color: var(--text-light);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .food-card .inventory::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #22C55E;
      }

      footer {
        background-color: var(--white);
        border-top: 1px solid rgba(0, 0, 0, 0.05);
        padding: 32px 0;
        text-align: center;
      }

      footer p {
        font-size: 15px;
        color: var(--text-light);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 0 20px;
        }

        .title-section h2 {
          font-size: 32px;
        }

        .title-section p {
          font-size: 16px;
        }

        .food-grid {
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 24px;
        }

        .food-card {
          padding: 24px;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .food-card {
        animation: fadeIn 0.6s ease forwards;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container header-content">
        <a href="#" class="back-button">← Back to Home</a>
        <h1>Peyman's Gourmet Kitchen</h1>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="title-section">
          <h2 id="page-title">Loading Menu...</h2>
          <p>Discover our carefully curated selection of culinary masterpieces</p>
        </div>
        <div class="food-grid">
          <!-- Food cards will be inserted here -->
        </div>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>© 2025 Peyman's Gourmet Kitchen • Crafted with ❤️ by Peyman Ahmadi</p>
      </div>
    </footer>

    <script type="module" src="./script.js"></script>
  </body>
</html>
